name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # e.g. https://suneelpm.github.io  and  /SMYTrust/
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # The Pages copy is a staging preview of a site whose real home is
      # smyservices.org. Let it be crawled and it competes with production for
      # the same content, so block indexing on this deployment only.
      - name: Block indexing of the preview deployment
        run: |
          printf 'User-agent: *
Disallow: /
' > dist/robots.txt
          find dist -name '*.html' -exec             sed -i 's#<meta name="viewport"#<meta name="robots" content="noindex, nofollow"><meta name="viewport"#' {} +
          echo "robots.txt:" && cat dist/robots.txt
          echo "noindex tags: $(grep -rl 'noindex' dist --include='*.html' | wc -l) pages"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
